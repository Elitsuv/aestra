[package]
name = "aestra_core"
version = "1.1.1"
edition = "2021"
description = "Deterministic execution sandbox core for Aestra CP Engine"
license = "MIT"

[lib]
name = "aestra_core"
crate-type = ["cdylib"]
path = "src/core/lib.rs"

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py310"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
