[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "aestra"
version = "0.1.1"
description = "A hybrid competitive programming execution sandbox."
requires-python = ">=3.10"

[project.scripts]
aestra = "src.cli:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest"
]

[tool.maturin]
module-name = "aestra_core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 88
src = ["."]

[tool.mypy]
strict = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "aestra_core"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]