name: "Performance & Sandboxing Issue"
description: "Report CPU overhead, memory measurement drift, or IPC latency regressions."
title: "[PERF]: "
labels: ["type: perf"]
body:
  - type: markdown
    attributes:
      value: |
        Report performance bottlenecks or measurement drift. Please review our [Contributing Guidelines](https://github.com/Elitsuv/aestra/blob/main/contributing.md).


  - type: dropdown
    id: domain
    attributes:
      label: Subsystem Boundary
      description: Where is the performance bottleneck occurring? (see contributing.md)
      options:
        - "domain: rust-core (PyO3 FFI overhead, POSIX system calls, process spawning)"
        - "domain: python-core (CLI parsing, string formatting, batch test concurrency)"
    validations:
      required: true

  - type: textarea
    id: benchmark-results
    attributes:
      label: Benchmark Results & Telemetry Metrics
      description: Share your measured execution times, memory usage, CPU time, or wall clock metrics.
      placeholder: |
        - Expected Overhead: <0.5ms per execution
        - Measured Overhead: 4.2ms per execution
        - Tested Sample Size: 1,000 test cases
    validations:
      required: true

  - type: textarea
    id: flamegraphs-proof
    attributes:
      label: Profiler Traces & Screenshots
      description: Attach flamegraphs, valgrind traces, perf logs, or terminal screenshots.
      placeholder: "Drag & drop flamegraphs, perf reports, or screenshots here..."
    validations:
      required: false
