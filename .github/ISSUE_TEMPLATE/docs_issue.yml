name: "Documentation Issue"
description: "Suggest improvements to README, architecture specs, FFI guides, or benchmarks."
title: "[DOCS]: "
labels: ["type: docs"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest documentation updates or improvements. Please review our [Contributing Guidelines](https://github.com/Elitsuv/aestra/blob/main/contributing.md).


  - type: dropdown
    id: doc-target
    attributes:
      label: Target Documentation Area
      description: Select which document or guide needs attention.
      options:
        - "README.md (Project Overview & Quickstart)"
        - "contributing.md (Developer Setup & Engineering Standards)"
        - "Architecture Specs & FFI Bridge Guides"
        - "Example CP Judge Configurations & Testcases"
    validations:
      required: true

  - type: textarea
    id: proposed-doc
    attributes:
      label: Proposed Content or Changes
      description: Describe what changes, diagrams, or explanations should be added or updated.
      placeholder: "Describe the proposed documentation updates here..."
    validations:
      required: true

  - type: textarea
    id: proof-references
    attributes:
      label: Screenshots or Reference Links
      description: Attach screenshots of formatting bugs, diagrams, or external reference links.
      placeholder: "Drag & drop screenshots or reference links here..."
    validations:
      required: false
