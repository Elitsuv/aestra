name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.1.0)"
        required: false
        default: "v1.1.2"

permissions:
  contents: write

jobs:
  build-msi:
    name: Build Windows MSI Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install WiX CLI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.* --ignore-failed-sources
          $dotnetTools = Join-Path $env:USERPROFILE ".dotnet\tools"
          if (Test-Path $dotnetTools) {
            $dotnetTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Compile MSI Installer
        shell: pwsh
        run: |
          $dotnetTools = Join-Path $env:USERPROFILE ".dotnet\tools"
          if (Test-Path $dotnetTools) {
            $env:PATH = "$dotnetTools;$env:PATH"
          }
          pwsh -File scripts/build_msi.ps1 -OutDir dist -Version ${{ github.ref_name || inputs.tag_name }}

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi

  build-and-release:
    name: Build & Publish Release
    needs: [build-msi]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin build

      - name: Build Source Distribution & Wheels
        run: |
          maturin sdist --out dist/
          maturin build --release --out dist/

      - name: Download MSI Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
